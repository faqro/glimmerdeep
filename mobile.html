<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Glimmerdeep</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #0b0917;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }

      /* Portrait shell: at least 2:3 height-to-width (width <= 2/3 of height) */
      #mobile-shell {
        width: 100vw;
        height: 100dvh;
        max-width: calc(100dvh * 2 / 3);
        display: flex;
        flex-direction: column;
        background: #0e0c21;
        border-left: 2px solid #2b2447;
        border-right: 2px solid #2b2447;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Top half (50%) for the 4:3 Phaser game with black letterbox/pillarbox padding */
      #game-container {
        width: 100%;
        height: 50%;
        flex: 1 1 50%;
        background: #000000;
        border-bottom: 2px solid #4a3b7d;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-height: 0;
      }

      #game-container canvas {
        image-rendering: pixelated !important;
        image-rendering: crisp-edges !important;
      }

      /* Bottom half (50%) touch controls area */
      #mobile-controls {
        flex: 1 1 50%;
        height: 50%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 10px 14px;
        background: linear-gradient(180deg, #120f29 0%, #0b0917 100%);
        min-height: 0;
      }

      .mc-columns {
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
      }

      .mc-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .mc-col-left {
        align-items: flex-start;
      }

      .mc-col-right {
        align-items: flex-end;
      }

      .mc-btn-row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .mc-btn {
        background: #241c47;
        color: #ffffff;
        border: 2px solid #6c5bb3;
        box-shadow: inset 0 -2px 0 #100d24, 0 2px 6px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .mc-btn-circle {
        border-radius: 50%;
        width: clamp(38px, 10.5vw, 48px);
        height: clamp(38px, 10.5vw, 48px);
      }

      .mc-btn-util {
        color: #b8a1ff;
      }

      .mc-btn-act {
        color: #ffe066;
        border-color: #8a75d6;
      }

      .mc-icon {
        width: 56%;
        height: 56%;
        display: block;
        pointer-events: none;
      }

      .mc-btn.active {
        background: #6c5bb3;
        border-color: #ffe066;
        color: #ffffff;
        transform: translateY(1px) scale(0.96);
      }

      .mc-stick-wrap,
      .mc-dpad-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .mc-pad-label {
        font-size: 10px;
        color: #7e71b8;
        letter-spacing: 0.8px;
      }

      .mc-stick-base {
        position: relative;
        width: min(38vw, 152px);
        height: min(38vw, 152px);
        border-radius: 50%;
        background: radial-gradient(circle at center, #1b1538 0%, #100d24 85%);
        border: 3px solid #6c5bb3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mc-stick-cross {
        position: absolute;
        width: 70%;
        height: 70%;
        border: 1px dashed #392e68;
        border-radius: 50%;
        pointer-events: none;
      }

      .mc-stick-knob {
        width: 42%;
        height: 42%;
        border-radius: 50%;
        background: #3d3170;
        border: 2px solid #f49ac1;
        box-shadow: 0 0 8px rgba(244, 154, 193, 0.35);
        pointer-events: none;
        transition: background-color 0.08s ease;
      }

      .mc-stick-knob.active {
        background: #6c5bb3;
        border-color: #ffe066;
      }

      .mc-dpad {
        width: min(40vw, 160px);
        height: min(40vw, 160px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mc-dpad-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="mobile-shell">
      <div id="game-container"></div>
      <div id="mobile-controls"></div>
    </div>
    <script type="module" src="/src/mobile/mobileMain.ts"></script>
  </body>
</html>
